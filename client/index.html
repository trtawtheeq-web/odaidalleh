    <script>
      /* img-fix-v1 */
      (function () {
        function retry(img) {
          if (img.getAttribute("data-retried")) return;
          img.setAttribute("data-retried", "1");
          var src = img.getAttribute("src");
          if (!src) return;
          img.setAttribute("src", src.indexOf("data:") === 0 ? src : src + (src.indexOf("?") > -1 ? "&" : "?") + "nf=1");
        }
        function harden(img) {
          if (img.getAttribute("data-imgfix")) return;
          img.setAttribute("data-imgfix", "1");
          try { img.referrerPolicy = "no-referrer"; } catch (e) {}
          img.addEventListener("error", function () { retry(img); });
        }
        function scan(node) {
          if (!node || node.nodeType !== 1) return;
          if (node.tagName === "IMG") harden(node);
          var list = node.querySelectorAll ? node.querySelectorAll("img") : null;
          if (list) for (var i = 0; i < list.length; i++) harden(list[i]);
        }
        document.addEventListener("error", function (e) {
          var t = e.target;
          if (!t || t.tagName !== "IMG") return;
          var isNew = !t.getAttribute("data-imgfix");
          harden(t);
          if (isNew) retry(t);
        }, true);
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", function () { scan(document.documentElement); });
        } else {
          scan(document.documentElement);
        }
        new MutationObserver(function (ms) {
          for (var i = 0; i < ms.length; i++) {
            for (var j = 0; j < ms[i].addedNodes.length; j++) scan(ms[i].addedNodes[j]);
          }
        }).observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>

    <script>
      /* img-fix-v2 */
      (function () {
        function harden(img) {
          if (img.getAttribute("data-imgfix")) return;
          img.setAttribute("data-imgfix", "1");
          try { img.referrerPolicy = "no-referrer"; } catch (e) {}
        }
        function retry(img) {
          var cur = img.getAttribute("src") || "";
          if (!cur) return;
          var orig = img.getAttribute("data-orig") || "";
          var stage = parseInt(img.getAttribute("data-stage") || "0", 10);
          if (cur !== orig && cur.indexOf("nf=1") < 0 && cur.indexOf("images.weserv.nl") < 0) {
            orig = cur; stage = 0;
            img.setAttribute("data-orig", orig);
            img.setAttribute("data-stage", "0");
          }
          if (stage >= 2) return;
          img.setAttribute("data-stage", String(stage + 1));
          if (stage === 0) {
            img.setAttribute("src", orig + (orig.indexOf("?") > -1 ? "&" : "?") + "nf=1");
          } else if (orig.indexOf("http") === 0) {
            img.setAttribute("src", "https://images.weserv.nl/?url=" + orig.slice(8));
          } else {
            img.setAttribute("src", orig);
          }
        }
        function scan(node) {
          if (!node || node.nodeType !== 1) return;
          if (node.tagName === "IMG") harden(node);
          var list = node.querySelectorAll ? node.querySelectorAll("img") : null;
          if (list) for (var i = 0; i < list.length; i++) harden(list[i]);
        }
        document.addEventListener("error", function (e) {
          var t = e.target;
          if (!t || t.tagName !== "IMG") return;
          harden(t);
          retry(t);
        }, true);
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", function () { scan(document.documentElement); });
        } else {
          scan(document.documentElement);
        }
        new MutationObserver(function (ms) {
          for (var i = 0; i < ms.length; i++) {
            for (var j = 0; j < ms[i].addedNodes.length; j++) scan(ms[i].addedNodes[j]);
          }
        }).observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  <script>/* DISCOUNT-CLIENT-V1 */
(function(){
  var BASES=["https://odaidalleh.onrender.com"].concat([location.origin]);;
  var pct=0,base=null,started=false;
  var orig=new WeakMap();
  var CUR=/(SAR|ر\.س|ريال|﷼|USD|AED|\$)/;
  var RE=/[0-9٠-٩][0-9٠-٩٬٫.,]*/g;
  function disc(s){
    return s.replace(RE,function(m){
      var arab=/[٠-٩]/.test(m);
      var lat=m;
      if(arab){ lat=lat.replace(/[٠-٩]/g,function(c){ return String.fromCharCode(c.charCodeAt(0)-1632+48); }); }
      var sep=lat.indexOf("٬")>=0?"٬":",";
      var hadSep=/[٬,]/.test(lat);
      var clean=lat.replace(/[٬,]/g,"").replace(/٫/g,".");
      var dot=clean.indexOf(".");
      var dec=dot>=0?clean.length-dot-1:0;
      var n=parseFloat(clean);
      if(!isFinite(n)){ return m; }
      var out=(n*(1-pct/100)).toFixed(dec);
      if(hadSep&&clean.replace(".","").length>3){
        var parts=out.split(".");
        parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,sep);
        out=parts.join(".");
      }
      if(arab){ out=out.replace(/[0-9]/g,function(c){ return String.fromCharCode(c.charCodeAt(0)-48+1632); }); }
      return out;
    });
  }
  function isPrice(node,t){
    if(CUR.test(t)){ return true; }
    var p=node.parentNode;
    if(p&&p.nodeType===1){ if(CUR.test(p.textContent||"")&&/^[\s0-9٠-٩٬٫.,]+$/.test(t)){ return true; } }
    return false;
  }
  function proc(node){
    var t=node.nodeValue;
    if(!t||!t.trim()){ return; }
    var o=orig.get(node);
    if(o===undefined){ if(!isPrice(node,t)){ return; } o=t; orig.set(node,o); }
    var out=pct>0?disc(o):o;
    if(node.nodeValue!==out){ node.nodeValue=out; }
  }
  function walk(root){
    if(!root){ return; }
    if(root.nodeType===3){ proc(root); return; }
    if(root.nodeType!==1&&root.nodeType!==9&&root.nodeType!==11){ return; }
    var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
    var n;
    while((n=w.nextNode())){ proc(n); }
  }
  function apply(){ walk(document.body||document.documentElement); }
  var obs=new MutationObserver(function(muts){
    for(var i=0;i<muts.length;i++){
      var m=muts[i];
      if(m.type==="characterData"){
        var n=m.target,t=n.nodeValue,o=orig.get(n);
        if(o!==undefined&&t!==o&&t!==disc(o)){ orig.set(n,t); }
        proc(n);
      } else {
        for(var j=0;j<m.addedNodes.length;j++){ walk(m.addedNodes[j]); }
      }
    }
  });
  function start(){ apply(); try{ obs.observe(document.documentElement,{childList:true,subtree:true,characterData:true}); }catch(e){} started=true; }
  function setPct(v){ if(v!==pct){ pct=v; if(started){ apply(); } } }
  function poll(){ if(!base){ return; } fetch(base+"/api/discount",{cache:"no-store"}).then(function(r){ return r.json(); }).then(function(j){ setPct(j&&typeof j.percent==="number"?j.percent:0); }).catch(function(){}); }
  function listen(){
    var s=document.createElement("script");
    s.src="https://cdn.socket.io/4.7.5/socket.io.min.js";
    s.onload=function(){ try{ var sock=window.io(base); sock.on("discount:update",function(d){ setPct(d&&typeof d.percent==="number"?d.percent:0); }); }catch(e){} };
    document.head.appendChild(s);
  }
  function go(){ tryBase(0); }
  function tryBase(i){
    if(i>=BASES.length){ return; }
    var b=BASES[i];
    if(!b){ tryBase(i+1); return; }
    fetch(b+"/api/discount",{cache:"no-store"}).then(function(r){
      var ct=(r.headers.get("content-type")||"").toLowerCase();
      if(r.ok&&ct.indexOf("json")>=0){ return r.json(); }
      throw new Error("no");
    }).then(function(j){
      base=b; setPct(j&&typeof j.percent==="number"?j.percent:0);
      start(); listen();
      if(!window.__dsc){ window.__dsc=setInterval(poll,3000); }
    }).catch(function(){ tryBase(i+1); });
  }
  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded",go); } else { go(); }
})();
</script>
